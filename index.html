<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小恐龍：荒野衝刺</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#152234;
  color:white;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
.game{
  width:min(960px,96vw);
}
h1{text-align:center;font-size:26px}
.info{
  flex-wrap:wrap;
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:12px 0;
  font-weight:bold;
}
canvas{
  width:100%;
  display:block;
  background:#bceaff;
  border:4px solid #fff;
  border-radius:15px;
}
.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}
button{
  padding:14px 22px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#ffcf54;
  color:#222;
  touch-action:none;
}
button:active{transform:scale(.95)}
.help{
  text-align:center;
  color:#c5d3e4;
  line-height:1.8;
}
progress{width:100%;height:10px;accent-color:#b880ff} button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<div class="game">
  <h1>🦖 小恐龍：荒野衝刺</h1>
  <p id="asset-status" class="help" role="status">角色圖片載入中，可先按開始遊玩…</p>
  <progress id="load-progress" max="8" value="0" aria-label="角色圖片載入進度"></progress>
  <div class="info">
    <span>分數：<span id="score">0</span></span>
    <span>金幣：<span id="coins">0</span></span>
    <span>最高紀錄：<span id="best">0</span></span>
    <span>盾牌：<span id="shield">準備完成</span></span>
    <span id="power-status">道具：尚未啟用</span>
    <span id="scene-status">場景：晨光草原</span>
  </div>

  <canvas id="canvas" width="900" height="400"></canvas>

  <div class="controls">
    <button id="start">開始 / 重玩</button>
    <button id="jump">跳躍</button>
    <button id="duck">蹲下</button>
    <button id="defend">盾牌</button>
    <button id="pause">暫停</button>
    <button id="mute" aria-pressed="false">音效：開</button>
  </div>

  <p class="help">
    空白鍵 / ↑：跳躍、二段跳　
    ↓：蹲下　
    Shift：盾牌　
    P：暫停　M：靜音<br>
    🧲 磁鐵自動吸金幣 8 秒　★ 無敵 5 秒　每 200 分切換場景
  </p>
</div>

const sprites={};
let impactUntil=0;
let endedAt=0;

function prepareSprite(img){
  const surface=document.createElement("canvas");
  surface.width=img.naturalWidth;
  surface.height=img.naturalHeight;
  const paint=surface.getContext("2d");
  paint.drawImage(img,0,0);
  const pixels=paint.getImageData(0,0,surface.width,surface.height);
  const data=pixels.data;
  const count=surface.width*surface.height;
  const seen=new Uint8Array(count);
  const queue=new Int32Array(count);
  let head=0,tail=0;
  function visit(i){
    if(i<0||i>=count||seen[i])return;
    seen[i]=1;
    const p=i*4;
    const lo=Math.min(data[p],data[p+1],data[p+2]);
    const hi=Math.max(data[p],data[p+1],data[p+2]);
    if(lo>220&&hi-lo<30){queue[tail++]=i;data[p+3]=0;}
  }
  for(let x=0;x<surface.width;x++){
    visit(x);visit(count-surface.width+x);
  }
  for(let y=0;y<surface.height;y++){
    visit(y*surface.width);visit(y*surface.width+surface.width-1);
  }
  while(head<tail){
    const i=queue[head++],x=i%surface.width;
    if(x>0)visit(i-1);
    if(x<surface.width-1)visit(i+1);
    visit(i-surface.width);visit(i+surface.width);
  }
  paint.putImageData(pixels,0,0);
  return surface;
}

const assetStatus=document.getElementById("asset-status");
let loadedAssets=0,failedAssets=0;
function assetProgress(){
  document.getElementById("load-progress").value=loadedAssets+failedAssets;
  assetStatus.textContent=`角色載入 ${loadedAssets}/8${failedAssets?" · 部分圖片失敗，重新整理可重試":""}`;
  document.getElementById("start").disabled=false;
  if(loadedAssets===8)assetStatus.textContent="角色圖片已就緒";
}
function loadSprite(state){
  return new Promise(resolve=>{
    const img=new Image();
    img.fetchPriority=state==="idle"?"high":"low";
    img.onload=()=>{
      sprites[state]=img;
      try{sprites[state]=prepareSprite(img);}catch{}
      loadedAssets++;assetProgress();
      resolve();
    };
    img.onerror=()=>{
      failedAssets++;assetProgress();
      resolve();
    };
    img.src=spriteFiles[state];
  });
}
loadSprite("idle").then(()=>{
  for(const state of Object.keys(spriteFiles)){
    if(state!=="idle")loadSprite(state);
  }
});

let coinTimer=0;
let lastTime=0;
let shieldCooldown=0;
let shieldTime=0;
let powerups=[],powerTimer=240,magnetTime=0,invincibleTime=0;
let muted=false,audio;try{muted=localStorage.getItem("dinoMuted")==="1";}catch{}
const muteButton=document.getElementById("mute");
function syncMute(){muteButton.textContent=muted?"音效：關":"音效：開";muteButton.setAttribute("aria-pressed",String(muted));}
syncMute();
function unlockAudio(){
  try{const Audio=window.AudioContext||window.webkitAudioContext;if(!audio&&Audio)audio=new Audio();if(audio?.state==="suspended")audio.resume().catch(()=>{});}catch{}
}
function sound(kind){
  if(muted||!audio||audio.state!=="running")return;
  const notes={jump:[380,650,.12],coin:[880,1320,.1],hit:[160,45,.22],power:[520,1040,.22],shield:[240,740,.18]};
  const [from,to,duration]=notes[kind];
  const oscillator=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  oscillator.type=kind==="hit"?"sawtooth":"sine";
  oscillator.frequency.setValueAtTime(from,t);oscillator.frequency.exponentialRampToValueAtTime(to,t+duration);
  gain.gain.setValueAtTime(.07,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);
  oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(t);oscillator.stop(t+duration);
}
muteButton.onclick=()=>{muted=!muted;try{localStorage.setItem("dinoMuted",muted?"1":"0");}catch{}syncMute();unlockAudio();};
const scenes=[
  {name:"晨光草原",sky:["#94d7ff","#e0f7ff"],mountain:"#a4d6ac",grass:"#78bc63",edge:"#478d46",sun:"#ffe16b"},
  {name:"落日沙丘",sky:["#df8ab7","#ffddb1"],mountain:"#c48f92",grass:"#d9ac72",edge:"#a57554",sun:"#ffb46b"},
  {name:"星夜秘境",sky:["#161e4b","#625080"],mountain:"#494c79",grass:"#575c83",edge:"#343c62",sun:"#eee6ff"}
];
function currentScene(){return scenes[Math.floor(score/200)%scenes.length];}
function playerBox(){return {x:dino.x+5,y:dino.y+(dino.duck?8:22),w:dino.w-10,h:dino.h-(dino.duck?10:24)};}


bestText.textContent=best;

const dino={
  x:110,
  y:ground-58,
  w:48,
  h:58,
  vy:0,
  jumps:0,
  duck:false
};

function reset(){
  unlockAudio();
  powerups=[];powerTimer=240;magnetTime=0;invincibleTime=0;
  dino.h=58;
  impactUntil=0;
  score=0;
  coins=0;
  speed=6;
  obstacles=[];
  golds=[];
  particles=[];
  spawnTimer=55;
  coinTimer=80;
  shieldCooldown=0;
  shieldTime=0;
  dino.y=ground-dino.h;
  dino.vy=0;
  dino.jumps=0;
  dino.duck=false;
  running=true;
  paused=false;
  gameOver=false;
  lastTime=performance.now();
  updateUI();
}

function jump(){
  if(!running||paused)return;
  if(dino.jumps<2){
    dino.vy=dino.jumps===0?-14:-12;
    dino.jumps++;
    sound("jump");
    dino.duck=false;
  }
}

function shield(){
  if(!running||paused)return;
  if(shieldCooldown<=0){
    sound("shield");
    shieldTime=120;
    shieldCooldown=420;
  }
}

function updateUI(){
  document.getElementById("scene-status").textContent="場景："+currentScene().name;
  document.getElementById("power-status").textContent=[magnetTime>0?"🧲 "+Math.ceil(magnetTime/60)+" 秒":"",invincibleTime>0?"★ "+Math.ceil(invincibleTime/60)+" 秒":""].filter(Boolean).join(" · ")||"道具：尚未啟用";
  scoreText.textContent=Math.floor(score);
  coinsText.textContent=coins;
  bestText.textContent=best;
  shieldText.textContent=
    shieldTime>0?"防禦中":
    shieldCooldown>0?
    Math.ceil(shieldCooldown/60)+" 秒":
    "準備完成";
}

function spawnObstacle(){
  const r=Math.random();
  let type,w,h,y;

  if(r<.35){
    type="cactus";
    w=36;
    h=65;
    y=ground-h;
  }else if(r<.65){
    type="rock";
    w=46;
    h=35;
    y=ground-h;
  }else if(r<.85){
    type="wood";
    w=33;
    h=48;
    y=ground-h;
  }else{
    type="bird";
    w=48;
    h=30;
    y=ground-100;
  }

  obstacles.push({x:W+30,y,w,h,type});
}

function spawnCoin(){
  golds.push({
    x:W+20,
    y:ground-70-Math.random()*95,
    r:12
  });
}

function hit(a,b){
  return a.x<b.x+b.w &&
         a.x+a.w>b.x &&
         a.y<b.y+b.h &&
         a.y+a.h>b.y;
}

function addParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:35,
      color
    });
  }
}

function endGame(){
  sound("hit");
  endedAt=performance.now();
  running=false;
  gameOver=true;
  if(Math.floor(score)>best){
    best=Math.floor(score);
    try{localStorage.setItem("dinoBest",best);}catch{}
  }
  updateUI();
}

function update(dt){
  if(!running||paused)return;

  const step=Math.min(dt/16.6667,2);
  score+=.16*step;
  speed=Math.min(14,6+score/180);

  magnetTime=Math.max(0,magnetTime-step);
  invincibleTime=Math.max(0,invincibleTime-step);
  powerTimer-=step;
  if(powerTimer<=0){powerups.push({x:W+30,y:ground-55-Math.random()*55,type:Math.random()<.5?"magnet":"invincible",w:30,h:30});powerTimer=480+Math.random()*240;}
  shieldCooldown=Math.max(0,shieldCooldown-step);
  shieldTime=Math.max(0,shieldTime-step);

  const height=dino.duck?34:58;
  const bottom=dino.y+dino.h;
  dino.h=height;

  if(dino.jumps===0){
    dino.y=ground-height;
  }else{
    dino.y=bottom-height;
  }

  dino.vy+=.7*step;
  dino.y+=dino.vy*step;

  if(dino.y+dino.h>=ground){
    dino.y=ground-dino.h;
    dino.vy=0;
    dino.jumps=0;
  }

  spawnTimer-=step;
  if(spawnTimer<=0){
    spawnObstacle();
    spawnTimer=(65+Math.random()*55)*(6/speed);
    spawnTimer=Math.max(33,spawnTimer);
  }

  coinTimer-=step;
  if(coinTimer<=0){
    spawnCoin();
    coinTimer=65+Math.random()*75;
  }

  const player=playerBox();

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.x-=speed*step;

    if(o.x+o.w<0){
      obstacles.splice(i,1);
      continue;
    }

    if(hit(player,o)){
      if(shieldTime>0||invincibleTime>0){
        sound("shield");
        impactUntil=performance.now()+300;
        addParticles(o.x,o.y,"#65dfff",18);
        obstacles.splice(i,1);
        shieldTime=0;
      }else{
        addParticles(dino.x,dino.y,"#ff5555",25);
        endGame();
        return;
      }
    }
  }

  for(let i=golds.length-1;i>=0;i--){
    const c=golds[i];
    c.x-=speed*step;

    if(c.x+c.r<0){
      golds.splice(i,1);
      continue;
    }

    if(magnetTime>0){
      const dx=player.x+player.w/2-c.x,dy=player.y+player.h/2-c.y;
      const distance=Math.hypot(dx,dy);
      if(distance<240&&distance>0){const pull=Math.min(distance,14*step);c.x+=dx/distance*pull;c.y+=dy/distance*pull;}
    }
    const box={
      x:c.x-c.r,
      y:c.y-c.r,
      w:c.r*2,
      h:c.r*2
    };

    if(hit(player,box)){
      sound("coin");
      coins++;
      score+=10;
      addParticles(c.x,c.y,"#ffd447",12);
      golds.splice(i,1);
    }
  }

  if(!running)return;
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.x-=speed*step;
    if(p.x+p.w<0){powerups.splice(i,1);continue;}
    if(hit(player,p)){
      if(p.type==="magnet")magnetTime=480;else invincibleTime=300;
      sound("power");addParticles(p.x+15,p.y+15,p.type==="magnet"?"#ff84c8":"#ffe778",18);
      powerups.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*step;
    p.y+=p.vy*step;
    p.vy+=.16*step;
    p.life-=step;
    if(p.life<=0)particles.splice(i,1);
  }

  updateUI();
}

function drawDino(){
  const now=performance.now();
  const state=gameOver?(now-endedAt<450?"hurt":"dead"):
    now<impactUntil?"attack":shieldTime>0?"shield":
    dino.duck?"duck":dino.jumps>0?"jump":running?"run":"idle";
  const sprite=sprites[state]||sprites.idle||Object.values(sprites)[0];
  if(sprite){
    // Anchors are measured at the character's feet; effects and shadows do not move the body.
    const anchors={idle:[530,1050],run:[500,977],jump:[570,820],duck:[520,950],shield:[650,1030],hurt:[570,940],dead:[540,995],attack:[700,930]};
    const pose=sprites[state]?state:sprites.idle?"idle":Object.keys(sprites)[0];
    const [cx,foot]=anchors[pose];
    const size=86;
    ctx.save();
    ctx.translate(dino.x+dino.w/2,dino.y+dino.h);
    if(pose!=="attack")ctx.scale(-1,1);
    ctx.drawImage(sprite,-cx/1254*size,-foot/1254*size,size,size);
    ctx.restore();
    if(magnetTime>0||invincibleTime>0||shieldTime>0){
      ctx.save();ctx.strokeStyle=invincibleTime>0?"#ffe778":magnetTime>0?"#ff84c8":"#65dfff";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(dino.x+24,dino.y+dino.h/2,43,dino.h/2+12,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    return;
  }
  ctx.save();
  ctx.fillStyle="#574281";
  ctx.font="14px sans-serif";
  ctx.textAlign="center";
  ctx.fillStyle="#7053a5";
  ctx.fillRect(dino.x,dino.y+10,dino.w,dino.h-10);
  ctx.fillStyle="#fff";ctx.fillRect(dino.x+32,dino.y+16,6,6);
  ctx.fillStyle="#574281";
  ctx.fillText("角色載入中…",dino.x+24,ground-70);
  ctx.restore();
}

function drawObstacle(o){
  if(o.type==="cactus"){
    ctx.fillStyle="#228b4e";
    ctx.fillRect(o.x+12,o.y,15,o.h);
    ctx.fillRect(o.x,o.y+22,12,12);
    ctx.fillRect(o.x,o.y+12,7,22);
    ctx.fillRect(o.x+27,o.y+33,10,11);
  }else if(o.type==="rock"){
    ctx.fillStyle="#7c8493";
    ctx.beginPath();
    ctx.moveTo(o.x,o.y+o.h);
    ctx.lineTo(o.x+8,o.y+10);
    ctx.lineTo(o.x+25,o.y);
    ctx.lineTo(o.x+o.w,o.y+o.h);
    ctx.fill();
  }else if(o.type==="wood"){
    ctx.fillStyle="#99612e";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle="#c38a4a";
    ctx.fillRect(o.x+8,o.y,5,o.h);
  }else{
    ctx.fillStyle="#7353aa";
    ctx.beginPath();
    ctx.ellipse(o.x+25,o.y+15,23,11,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(o.x+20,o.y+15);
    ctx.lineTo(o.x+3,o.y-8);
    ctx.lineTo(o.x+34,o.y+10);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillRect(o.x+38,o.y+9,4,4);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const scene=currentScene();
  // 天空
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,scene.sky[0]);
  sky.addColorStop(1,scene.sky[1]);
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // 太陽
  ctx.fillStyle=scene.sun;
  ctx.beginPath();
  ctx.arc(750,70,34,0,Math.PI*2);
  ctx.fill();

  // 遠山
  ctx.fillStyle=scene.mountain;
  for(let x=-100;x<W+200;x+=210){
    ctx.beginPath();
    ctx.moveTo(x,ground);
    ctx.lineTo(x+105,170);
    ctx.lineTo(x+210,ground);
    ctx.fill();
  }

  // 草地
  ctx.fillStyle=scene.grass;
  ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle=scene.edge;
  ctx.fillRect(0,ground,W,6);

  // 地面線條
  ctx.fillStyle=scene.edge;
  for(let x=0;x<W;x+=45){
    const offset=running?(score*5)%45:0;
    ctx.fillRect(x-offset,ground+30,20,4);
  }

  for(const c of golds){
    ctx.fillStyle="#ffc928";
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#ed9c16";
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.fillStyle="#fff4a4";
    ctx.font="bold 17px Arial";
    ctx.textAlign="center";
    ctx.fillText("$",c.x,c.y+6);
  }

  if(scene===scenes[2]){
    ctx.fillStyle="#fff8d9";for(let i=0;i<30;i++){ctx.fillRect((i*137+17)%W,20+(i*61)%170,2,2);}
  }
  for(const p of powerups){
    ctx.fillStyle=p.type==="magnet"?"#9e437b":"#b58926";ctx.beginPath();ctx.arc(p.x+15,p.y+15,19,0,Math.PI*2);ctx.fill();
    ctx.font="24px sans-serif";ctx.textAlign="center";ctx.fillStyle="white";ctx.fillText(p.type==="magnet"?"🧲":"★",p.x+15,p.y+24);
  }
  for(const o of obstacles)drawObstacle(o);
  drawDino();

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/35);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,5,5);
  }
  ctx.globalAlpha=1;

  if(!running||paused){
    ctx.fillStyle="rgba(0,0,0,.48)";
    ctx.fillRect(0,0,W,H);

    ctx.textAlign="center";
    ctx.fillStyle="white";
    ctx.font="bold 43px Arial";

    const msg=paused?"遊戲暫停":
      gameOver?"遊戲結束":"小恐龍：荒野衝刺";

    ctx.fillText(msg,W/2,170);

    ctx.font="22px Arial";
    ctx.fillText(
      paused?"按 P 繼續":
      "按「開始 / 重玩」開始冒險",
      W/2,215
    );
  }
}

function loop(t){
  const dt=lastTime?t-lastTime:16.67;
  lastTime=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick=reset;
document.getElementById("jump").onclick=jump;
document.getElementById("defend").onclick=shield;

function togglePause(){
  if(running)paused=!paused;
}

document.getElementById("pause").onclick=togglePause;

const duckButton=document.getElementById("duck");

duckButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  dino.duck=true;
});

function stopDuck(){
  dino.duck=false;
}
duckButton.addEventListener("pointerup",stopDuck);
duckButton.addEventListener("pointercancel",stopDuck);
duckButton.addEventListener("pointerleave",stopDuck);

const keys=new Set();

document.addEventListener("keydown",e=>{
  if(["Space","ArrowUp","ArrowDown","ShiftLeft","ShiftRight"].includes(e.code)){
    e.preventDefault();
  }

  if(keys.has(e.code))return;
  keys.add(e.code);

  if(e.code==="Space"||e.code==="ArrowUp"){if(!running)reset();else jump();}
  if(e.code==="ArrowDown")dino.duck=true;
  if(e.code==="ShiftLeft"||e.code==="ShiftRight")shield();
  if(e.code==="KeyP")togglePause();
  if(e.code==="KeyM")muteButton.click();
  if(e.code==="Enter"&&!running)reset();
});

document.addEventListener("keyup",e=>{
  keys.delete(e.code);
  if(e.code==="ArrowDown")dino.duck=false;
});

window.addEventListener("blur",()=>{
  keys.clear();
  dino.duck=false;
  if(running)paused=true;
});

requestAnimationFrame(loop);
</script>
</body>
